<script>
  // Initialize date pickers
  flatpickr("#from-date", {
    dateFormat: "Y-m-d"
  });

  flatpickr("#to-date", {
    dateFormat: "Y-m-d"
  });

  function exportLeads() {
  const fromDate = document.getElementById("from-date").value;
  const toDate = document.getElementById("to-date").value;
  const type = document.getElementById("export-type").value;

  if (!fromDate || !toDate) {
    alert("Please select both From and To dates.");
    return;
  }

  // Redirect based on selected type
  if (type === "history") {
    window.location.href = `/leads_export/?from_date=${fromDate}&to_date=${toDate}`;
  }
  else if (type === "updated_leads")
  {
    window.location.href = `/updated_leads_export/?from_date=${fromDate}&to_date=${toDate}`;
  }
  else if (type === "fr_leads")
  {
    window.location.href = `/fr_leads_export/?from_date=${fromDate}&to_date=${toDate}`;
  }
  else if (type === "lead_close_status")
  {
    window.location.href = `/lead_close_status_export/?from_date=${fromDate}&to_date=${toDate}`;
  }
   else {
    window.location.href = `/main_leads_export/?from_date=${fromDate}&to_date=${toDate}`;
  }
}

</script>
